[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replaylab"
version = "0.1.1"
description = "Turn demonstration videos into evidence-linked, reviewable browser skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "openai>=1.60,<3",
  "playwright>=1.49,<2",
  "yt-dlp>=2025.1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
replaylab = "replaylab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["replaylab"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
